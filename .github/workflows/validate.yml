name: Validate OKF
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.11'
      - run: python -m pip install --requirement requirements.txt
      - run: |
          python scripts/build.py
          python scripts/build_site.py
          python scripts/prepare_clients.py
          python scripts/build.py --check
          python scripts/build_site.py --check
          python scripts/check_downloads.py
          python scripts/build_pages.py
          python scripts/build_pages.py --check
      - name: Record candidate identity
        id: identity
        run: printf 'manifest_sha256=%s\n' "$(sha256sum _site/publication.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload the Pages candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: [validate, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check live identity and site files
        env:
          OKF_COMMIT: ${{ github.sha }}
          OKF_MANIFEST_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
        run: python3 scripts/verify_pages.py --commit "$OKF_COMMIT" --manifest-sha256 "$OKF_MANIFEST_SHA256"
